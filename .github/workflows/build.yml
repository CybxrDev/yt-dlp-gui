# Builds the standalone app for Windows, macOS (Apple Silicon + Intel) and Linux.
# Run it manually from the Actions tab, or push a tag like "v1.0.0".
# The finished apps are attached to the workflow run as downloadable artifacts.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: macos-latest        # Apple Silicon
            artifact: macos-arm64
          - os: macos-15-intel      # Intel Macs (runner label may change; see GitHub docs)
            artifact: macos-x64
          - os: ubuntu-22.04        # older glibc = runs on more Linux distributions
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build
        run: python packaging/build.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-gui-${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/yt-dlp-gui
